<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageMate</title>
<style>
  :root {
    --bg: #f4f7f6; --card: #ffffff; --ink: #15201f; --muted: #5d6e6c; --line: #d8e1e0;
    --accent: #1d7874; --accent-soft: #e2f0ef; --rec: #b33b2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1615; --card: #16201f; --ink: #e8efee; --muted: #9fb3b1; --line: #2c3b3a;
      --accent: #3fbfb5; --accent-soft: #1d2c2b; --rec: #f08a7d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 372px; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px 12px 10px; }
  header { display: flex; align-items: center; gap: 9px; margin: 0 2px 10px; }
  header img { width: 24px; height: 24px; border-radius: 6px; }
  header h1 { flex: 1; margin: 0; font-size: 15px; letter-spacing: -0.01em; }
  .page { color: var(--muted); font-size: 12px; margin: -6px 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { background: var(--accent-soft); border-radius: 9px; padding: 7px 10px; margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  h2 { margin: 12px 2px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  h2:first-of-type { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button.tile {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; min-height: 64px;
    padding: 9px 3px 7px; font: inherit; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2;
    color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 11px; cursor: pointer;
  }
  button.tile svg { width: 22px; height: 22px; flex: none; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button.tile svg .solid { fill: var(--accent); stroke: none; }
  button.tile.rec svg { stroke: var(--rec); } button.tile.rec svg .solid { fill: var(--rec); }
  button.tile:hover:not(:disabled), button.tile:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  button.tile:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  button.tile:disabled { opacity: .42; cursor: default; }
  button.tile.wide { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 10px 12px; min-height: 0; text-align: left; font-size: 13px; }
  kbd { font: 600 10.5px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--bg); white-space: nowrap; }
  button.tile > kbd { position: absolute; top: 4px; right: 5px; }
  button.tile.wide > kbd { position: static; margin-left: auto; }
  button.tile:disabled > kbd { opacity: .6; }
  .list { display: grid; gap: 6px; }
  .list small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .back { font: inherit; font-weight: 600; font-size: 13px; background: none; border: 0; color: var(--accent); padding: 2px 4px; cursor: pointer; border-radius: 6px; }
  .back:focus-visible { outline: 2px solid var(--accent); }
  footer { display: flex; gap: 14px; align-items: center; margin: 12px 2px 0; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12px; }
  footer button { font: inherit; font-size: 12px; background: none; border: 0; padding: 2px 0; color: var(--accent); cursor: pointer; font-weight: 600; }
  footer button:hover { text-decoration: underline; }
  footer .end { margin-left: auto; }
  .keytable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .keytable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 6px 5px 0; position: sticky; top: 0; background: var(--bg); }
  .keytable td { padding: 4px 6px 4px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  .keytable td.none { color: var(--muted); }
  .scroll { max-height: 360px; overflow: auto; margin-bottom: 8px; padding-right: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px; }
  .primary { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .primary { color: #0f1615; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><h1>PageMate</h1></header>
<div class="page" id="page"></div>
<div class="note" id="note" hidden></div>

<main id="main"></main>

<section id="shotView" hidden>
  <h2><button class="back" id="shotBack" type="button">‹ Back</button> Screenshot</h2>
  <div class="list" id="shotList"></div>
</section>

<section id="keysView" hidden>
  <h2><button class="back" id="keysBack" type="button">‹ Back</button> Keyboard shortcuts</h2>
  <div class="scroll"><table class="keytable" id="keyTable"></table></div>
  <button class="primary" id="setKeys" type="button">Set or change shortcuts…</button>
  <p class="hint" id="setKeysHelp" role="status"></p>
  <p class="hint">In this toolbox, press a tool’s letter to start it, or use the arrow keys and Enter. “Anywhere” shortcuts work from any page; browsers let only four tools come with one ready-made, so choose your own for the rest.</p>
</section>

<footer>
  <button id="allNotes" type="button" data-key="o" title="All my notes (O)">All my notes</button>
  <button id="settings" type="button" data-key="," title="Settings (,)">Settings</button>
  <button id="shortcuts" type="button" data-key="?" class="end" title="Keyboard shortcuts (?)">Shortcuts</button>
</footer>
<script src="toolbox-core.js"></script>
<script src="popup.js"></script>
</body>
</html>
